<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmet Detection App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .image-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .image-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .image-box img {
            max-width: 400px;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .helmet-status {
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
            color: green;
        }
        input[type="file"] {
            margin-top: 20px;
        }
        input[type="submit"] {
            margin-left: 10px;
            padding: 5px 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Helmet Detection App</h1>
    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <input type="submit" value="Upload & Predict">
    </form>

    {% if uploaded_image and output_image %}
    <div class="image-container">
        <div class="image-box">
            <h3>Original Image</h3>
            <img src="{{ uploaded_image }}" alt="Uploaded Image">
        </div>
        <div class="image-box">
            <h3>Processed Image</h3>
            <img src="{{ output_image }}" alt="Output Image">
            <div class="helmet-status">{{ helmet_result }}</div>
        </div>
    </div>
    {% endif %}
</body>
</html>
